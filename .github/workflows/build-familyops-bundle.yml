name: Build FamilyOpsDA AppBundle

# Builds the Revit Design Automation AppBundle on Windows (Mac users: use this).
# No local Revit install required — API comes from NuGet.

on:
  workflow_dispatch:
  push:
    paths:
      - "revit/FamilyOpsDA/**"
      - ".github/workflows/build-familyops-bundle.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build plugin
        working-directory: revit/FamilyOpsDA
        run: dotnet build -c Release
      - name: Stage bundle
        shell: pwsh
        working-directory: revit/FamilyOpsDA
        run: |
          $bin = "bin/Release/net8.0-windows"
          $stage = ".bundle_stage/FamilyOpsDA.bundle"
          New-Item -ItemType Directory -Force -Path "$stage/Contents" | Out-Null
          Copy-Item PackageContents.xml $stage/
          Copy-Item FamilyOpsDA.addin "$stage/Contents/"
          Copy-Item "$bin/FamilyOpsDA.dll" "$stage/Contents/"
          if (Test-Path "$bin/Newtonsoft.Json.dll") { Copy-Item "$bin/Newtonsoft.Json.dll" "$stage/Contents/" }
          Compress-Archive -Path .bundle_stage/FamilyOpsDA.bundle -DestinationPath ../../FamilyOpsDA.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyOpsDA-appbundle
          path: FamilyOpsDA.zip
